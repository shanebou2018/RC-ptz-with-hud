<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>RC PTZ HUD</title>
  <style>
    :root {
      --bg: #05070a;
      --panel-bg: rgba(13, 18, 26, 0.75);
      --panel-border: rgba(255, 255, 255, 0.10);
      --accent: #00d4ff;
      --danger: #ff4d4f;
      --danger-soft: rgba(255, 77, 79, 0.15);
      --text: #eaf6ff;
      --text-muted: rgba(234, 246, 255, 0.55);
      --mono: "SFMono-Regular", Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); }

    .stage {
      position: relative; width: 1280px; height: 720px; margin: 0 auto;
      border-radius: 16px; overflow: hidden; background: #000;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 24px 60px rgba(0,0,0,0.6);
    }
    video, canvas.hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    canvas.hud { pointer-events: none; }

    #status {
      position: absolute; top: 16px; right: 16px;
      display: flex; align-items: center; gap: 7px;
      background: rgba(8,14,20,0.6); border: 1px solid var(--panel-border);
      border-radius: 999px; padding: 6px 12px 6px 10px;
      font: 700 10px var(--sans); letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--text-muted);
    }
    #status .dot { width: 7px; height: 7px; border-radius: 50%; background: #666; flex: none; }
    #status.live { color: var(--text); }
    #status.live .dot { background: #2ee6a6; box-shadow: 0 0 6px #2ee6a6; }
    #status.error .dot { background: var(--danger); box-shadow: 0 0 6px var(--danger); }

    #controls { width: 1280px; margin: 20px auto 40px; display: flex; gap: 20px; }
    .panel {
      flex: 1; background: var(--panel-bg); border: 1px solid var(--panel-border);
      border-radius: 14px; padding: 18px 22px;
    }
    .panel h2 {
      margin: 0 0 16px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--text-muted); font-weight: 700;
    }
    .slider-row { display: flex; align-items: center; gap: 14px; margin: 12px 0; }
    .slider-row label {
      width: 56px; font-size: 12px; color: var(--text-muted); font-weight: 700; letter-spacing: 0.03em;
    }
    .slider-row output { width: 40px; text-align: right; font: 700 13px var(--mono); color: var(--text); }
    input[type=range] {
      flex: 1; -webkit-appearance: none; height: 4px; border-radius: 2px;
      background: rgba(255,255,255,0.12); outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
      background: var(--accent); cursor: pointer; box-shadow: 0 0 8px rgba(0,212,255,0.6);
      border: 2px solid var(--bg);
    }
    .chip-row { display: flex; gap: 10px; margin-top: 16px; }
    .chip {
      flex: 1; padding: 9px 0; text-align: center; border-radius: 8px;
      border: 1px solid var(--panel-border); background: rgba(255,255,255,0.04);
      color: var(--text-muted); font: 700 11px var(--sans); letter-spacing: 0.05em;
      text-transform: uppercase; cursor: pointer; transition: all .15s ease;
    }
    .chip:hover { border-color: rgba(255,255,255,0.25); color: var(--text); }
    .chip.active { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }
    .chip.stop { border-color: rgba(255,77,79,0.4); color: var(--danger); }
    .chip.stop:hover { background: var(--danger-soft); border-color: var(--danger); }

    #keyHint {
      width: 1280px; margin: -20px auto 40px; text-align: center;
      font-size: 11px; letter-spacing: 0.02em; color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="stage">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="hud" class="hud" width="1280" height="720"></canvas>
    <div id="status"><span class="dot"></span><span id="statusText">connecting</span></div>
  </div>

  <div id="controls">
    <div class="panel">
      <h2>Servos</h2>
      <div class="slider-row"><label>Pan</label><input type="range" min="0" max="180" value="90" data-servo="pan"><output>90</output></div>
      <div class="slider-row"><label>Tilt</label><input type="range" min="0" max="180" value="90" data-servo="tilt"><output>90</output></div>
      <div class="slider-row"><label>Focus</label><input type="range" min="0" max="180" value="0" data-servo="focus"><output>0</output></div>
      <div class="slider-row"><label>Zoom</label><input type="range" min="0" max="180" value="0" data-servo="zoom"><output>0</output></div>
      <div class="chip-row">
        <div class="chip" id="fireBtn" data-servo-toggle="fire">Fire</div>
        <div class="chip" id="loadBtn" data-servo-toggle="load">Load</div>
      </div>
    </div>

    <div class="panel">
      <h2>Drive</h2>
      <div class="slider-row"><label>Speed</label><input type="range" value="150" id="speedSlider"><output id="speedOutput">150</output></div>
      <div class="slider-row"><label>Left</label><input type="range" value="0" data-motor="l"><output>0</output></div>
      <div class="slider-row"><label>Right</label><input type="range" value="0" data-motor="r"><output>0</output></div>
      <div class="chip-row">
        <div class="chip stop" id="stopBtn">All stop</div>
      </div>
    </div>
  </div>

  <div id="keyHint">&larr;&rarr; pan &middot; &uarr;&darr; tilt &middot; I / O zoom &middot; F fire &middot; L load &middot; W A S D drive (speed set above) &middot; Esc stop</div>

  <script>
    // MediaMTX serves its own WHEP endpoint; the browser talks to it
    // directly, not through this FastAPI app. Adjust the port if MediaMTX's
    // webrtcAddress differs from the default in mediamtx/mediamtx.yml.
    const MEDIAMTX_HOST = location.hostname;
    const MEDIAMTX_WEBRTC_PORT = 8889;
    const STREAM_PATH = "robot";
    const CONTROL_WS_PORT = 8765;

    // ---- Safety limits — tune these for your hardware. Keep MAX_MOTOR_PWM
    // in sync with MAX_MOTOR_PWM in control/esp32_firmware/esp32_firmware.ino
    // and control/esp32_bridge.py. HEARTBEAT_INTERVAL_MS must stay well
    // under the firmware's COMMAND_TIMEOUT_MS (500ms) or the deadman switch
    // will cut the motors while you're still actively driving. ------------
    const MAX_MOTOR_PWM = 200;
    const HEARTBEAT_INTERVAL_MS = 200;

    // ---- Keyboard control tuning --------------------------------------
    const PAN_TILT_STEP_DEG = 2;   // per tick, while an arrow key is held
    const ZOOM_STEP_DEG = 2;       // per tick, while I/O is held
    const KEY_TICK_MS = 50;        // how often held keys are re-applied
    // Cosmetic only (matches the ESP32's PULSE_HOLD_MS, but isn't what
    // actually times the servo — see triggerPulse() below): how long the
    // FIRE/LOAD button shows its "active" click-feedback state.
    const FIRE_LOAD_PULSE_MS = 500;

    const statusEl = document.getElementById("status");
    const statusTextEl = document.getElementById("statusText");

    function setStatus(text, state) {
      statusTextEl.textContent = text;
      statusEl.className = state || "";
    }

    async function startVideo() {
      const pc = new RTCPeerConnection();
      pc.addTransceiver("video", { direction: "recvonly" });
      pc.ontrack = (event) => {
        document.getElementById("video").srcObject = event.streams[0];
      };
      pc.onconnectionstatechange = () => {
        if (["disconnected", "failed", "closed"].includes(pc.connectionState)) {
          setStatus("video " + pc.connectionState, "error");
        }
      };

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);

      const whepUrl = `http://${MEDIAMTX_HOST}:${MEDIAMTX_WEBRTC_PORT}/${STREAM_PATH}/whep`;
      const res = await fetch(whepUrl, {
        method: "POST",
        headers: { "Content-Type": "application/sdp" },
        body: offer.sdp,
      });
      if (!res.ok) {
        setStatus(`WHEP error ${res.status}`, "error");
        return;
      }
      const answerSdp = await res.text();
      await pc.setRemoteDescription({ type: "answer", sdp: answerSdp });
    }

    // ---- HUD drawing helpers -----------------------------------------------

    function glassPanel(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, r);
      ctx.fillStyle = "rgba(8,14,20,0.55)";
      ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.14)";
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    function drawHeadingTape(ctx, cx, y, width, hdg) {
      const height = 46;
      const left = cx - width / 2;
      glassPanel(ctx, left, y - height / 2, width, height, 10);

      ctx.save();
      ctx.beginPath();
      ctx.rect(left + 10, y - height / 2, width - 20, height);
      ctx.clip();

      const pxPerDeg = (width - 20) / 100;
      const dirNames = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];

      for (let deg = 0; deg < 360; deg += 15) {
        const delta = ((deg - hdg + 540) % 360) - 180;
        if (Math.abs(delta) > 55) continue;
        const x = cx + delta * pxPerDeg;
        const major = deg % 45 === 0;
        ctx.strokeStyle = major ? "rgba(234,246,255,0.75)" : "rgba(234,246,255,0.3)";
        ctx.lineWidth = major ? 2 : 1;
        ctx.beginPath();
        ctx.moveTo(x, y + height / 2 - (major ? 16 : 9));
        ctx.lineTo(x, y + height / 2 - 3);
        ctx.stroke();
        if (major) {
          ctx.fillStyle = "rgba(234,246,255,0.85)";
          ctx.font = "700 11px -apple-system, sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(dirNames[deg / 45], x, y - height / 2 + 13);
        }
      }
      ctx.restore();

      ctx.fillStyle = "#00d4ff";
      ctx.beginPath();
      ctx.moveTo(cx, y + height / 2 + 2);
      ctx.lineTo(cx - 6, y + height / 2 + 12);
      ctx.lineTo(cx + 6, y + height / 2 + 12);
      ctx.closePath();
      ctx.fill();

      ctx.font = "700 20px SFMono-Regular, Menlo, Consolas, monospace";
      ctx.fillStyle = "#eaf6ff";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(`${Math.round(hdg)}°`, cx, y);
    }

    function statusPill(ctx, x, y, label, active) {
      const w = 74, h = 24;
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, h / 2);
      ctx.fillStyle = active ? "rgba(255,77,79,0.18)" : "rgba(255,255,255,0.06)";
      ctx.fill();
      ctx.strokeStyle = active ? "#ff4d4f" : "rgba(255,255,255,0.2)";
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = active ? "#ff4d4f" : "rgba(234,246,255,0.5)";
      ctx.font = "700 10px -apple-system, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(label, x + w / 2, y + h / 2 + 1);
    }

    function drawServoPanel(ctx, x, y, servo) {
      const w = 200, h = 178;
      glassPanel(ctx, x, y, w, h, 12);

      ctx.textAlign = "left";
      ctx.textBaseline = "alphabetic";
      ctx.font = "700 10px -apple-system, sans-serif";
      ctx.fillStyle = "rgba(234,246,255,0.5)";
      ctx.fillText("SERVOS", x + 18, y + 24);

      const rows = [
        ["Pan", `${servo.pan ?? 0}°`],
        ["Tilt", `${servo.tilt ?? 0}°`],
        ["Focus", `${servo.focus ?? 0}°`],
        ["Zoom", `${servo.zoom ?? 0}°`],
      ];
      rows.forEach(([label, val], i) => {
        const ry = y + 48 + i * 24;
        ctx.font = "600 13px -apple-system, sans-serif";
        ctx.fillStyle = "rgba(234,246,255,0.55)";
        ctx.textAlign = "left";
        ctx.fillText(label, x + 18, ry);
        ctx.font = "700 14px SFMono-Regular, Menlo, Consolas, monospace";
        ctx.fillStyle = "#eaf6ff";
        ctx.textAlign = "right";
        ctx.fillText(val, x + w - 18, ry);
      });

      statusPill(ctx, x + 18, y + h - 34, "FIRE", !!servo.fire);
      statusPill(ctx, x + 18 + 74 + 8, y + h - 34, "LOAD", !!servo.load);
    }

    function drawMotorRow(ctx, x, y, w, label, motor) {
      const dir = motor?.dir ?? 1;
      const pwm = motor?.pwm ?? 0;
      const frac = Math.max(0, Math.min(1, pwm / MAX_MOTOR_PWM));

      ctx.font = "700 12px -apple-system, sans-serif";
      ctx.fillStyle = "rgba(234,246,255,0.85)";
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillText(label, x, y);

      const barX = x + 18, barW = w - 60, barH = 6;
      ctx.beginPath();
      ctx.roundRect(barX, y - barH / 2, barW, barH, barH / 2);
      ctx.fillStyle = "rgba(255,255,255,0.1)";
      ctx.fill();

      if (pwm > 0) {
        ctx.beginPath();
        ctx.roundRect(barX, y - barH / 2, Math.max(barH, barW * frac), barH, barH / 2);
        ctx.fillStyle = dir ? "#00d4ff" : "#ff4d4f";
        ctx.fill();
      }

      ctx.font = "600 12px -apple-system, sans-serif";
      ctx.fillStyle = "rgba(234,246,255,0.5)";
      ctx.textAlign = "right";
      ctx.fillText(dir ? "▲" : "▼", x + w, y);
    }

    function drawMotorPanel(ctx, x, y, motorL, motorR) {
      const w = 230, h = 96;
      glassPanel(ctx, x, y, w, h, 12);
      ctx.font = "700 10px -apple-system, sans-serif";
      ctx.fillStyle = "rgba(234,246,255,0.5)";
      ctx.textAlign = "left";
      ctx.textBaseline = "alphabetic";
      ctx.fillText("DRIVE", x + 18, y + 24);

      drawMotorRow(ctx, x + 18, y + 46, w - 36, "L", motorL);
      drawMotorRow(ctx, x + 18, y + 74, w - 36, "R", motorR);
    }

    function drawGpsPill(ctx, cx, y) {
      const w = 240, h = 28;
      const x = cx - w / 2;
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, h / 2);
      ctx.fillStyle = "rgba(8,14,20,0.5)";
      ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.12)";
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = "rgba(234,246,255,0.4)";
      ctx.font = "700 10px -apple-system, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("GPS NOT CONNECTED", cx, y + h / 2 + 1);
    }

    let latestTelemetry = null;

    function render() {
      const canvas = document.getElementById("hud");
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (latestTelemetry) {
        const t = latestTelemetry;
        const margin = 24;

        drawHeadingTape(ctx, canvas.width / 2, 46, 460, t.hdg ?? 0);
        drawServoPanel(ctx, margin, canvas.height - margin - 178, t.servo ?? {});
        drawMotorPanel(ctx, canvas.width - margin - 230, canvas.height - margin - 96, t.motor?.l, t.motor?.r);
        drawGpsPill(ctx, canvas.width / 2, canvas.height - margin - 28);
      }
      requestAnimationFrame(render);
    }

    // ---- Control websocket: receives telemetry, sends commands -----------

    let ws;
    function startControlSocket() {
      ws = new WebSocket(`ws://${location.hostname}:${CONTROL_WS_PORT}`);
      ws.onopen = () => { setStatus("live", "live"); };
      ws.onclose = () => { setStatus("control offline", "error"); };
      ws.onerror = () => { setStatus("control error", "error"); };
      ws.onmessage = (event) => {
        latestTelemetry = JSON.parse(event.data);
      };
    }

    function sendCommand(cmd) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(cmd));
      }
    }

    // ---- Shared setters: used by both mouse-driven sliders and the
    // keyboard tick loop below, so the on-screen sliders always reflect
    // whatever actually got sent, regardless of input source. ------------

    function servoSliderEl(name) { return document.querySelector(`input[data-servo="${name}"]`); }
    function motorSliderEl(side) { return document.querySelector(`input[data-motor="${side}"]`); }

    function setServo(name, pos) {
      pos = Math.max(0, Math.min(180, Math.round(pos)));
      const input = servoSliderEl(name);
      if (input) {
        input.value = pos;
        input.nextElementSibling.textContent = pos;
      }
      sendCommand({ type: "servo", name, pos });
    }

    function setMotor(side, value) {
      value = Math.max(-MAX_MOTOR_PWM, Math.min(MAX_MOTOR_PWM, Math.round(value)));
      const input = motorSliderEl(side);
      if (input) {
        input.value = value;
        input.nextElementSibling.textContent = value;
      }
      sendCommand({ type: "motor", side, dir: value >= 0 ? 1 : 0, pwm: Math.abs(value) });
    }

    // Momentary trigger, not a toggle: the ESP32 firmware owns the actual
    // swing-out-and-return sequence (non-blocking, via millis() — see
    // esp32_firmware.ino) so it completes reliably even if this page's
    // connection hiccups mid-pulse. "pos" is ignored for fire/load; any
    // command just triggers it. The button's "active" class here is purely
    // a click-feedback cue — the canvas HUD's FIRE/LOAD pills are the real
    // status indicator, driven by live telemetry.
    function triggerPulse(servoName, btnEl) {
      sendCommand({ type: "servo", name: servoName, pos: 1 });
      btnEl?.classList.add("active");
      setTimeout(() => btnEl?.classList.remove("active"), FIRE_LOAD_PULSE_MS);
    }

    function wireControls() {
      document.querySelectorAll("input[data-servo]").forEach((input) => {
        const output = input.nextElementSibling;
        input.addEventListener("input", () => {
          output.textContent = input.value;
          sendCommand({ type: "servo", name: input.dataset.servo, pos: Number(input.value) });
        });
      });

      document.querySelectorAll("[data-servo-toggle]").forEach((btn) => {
        btn.addEventListener("click", () => triggerPulse(btn.dataset.servoToggle, btn));
      });

      document.querySelectorAll("input[data-motor]").forEach((input) => {
        input.min = -MAX_MOTOR_PWM;
        input.max = MAX_MOTOR_PWM;
        const output = input.nextElementSibling;
        input.addEventListener("input", () => {
          output.textContent = input.value;
          const value = Number(input.value);
          sendCommand({
            type: "motor",
            side: input.dataset.motor,
            dir: value >= 0 ? 1 : 0,
            pwm: Math.abs(value),
          });
        });
      });

      const speedSlider = document.getElementById("speedSlider");
      speedSlider.min = 0;
      speedSlider.max = MAX_MOTOR_PWM;
      speedSlider.addEventListener("input", () => {
        driveSpeed = Number(speedSlider.value);
        document.getElementById("speedOutput").textContent = driveSpeed;
      });

      document.getElementById("stopBtn").addEventListener("click", stopDrive);
    }

    // While a key is physically held, the browser keeps firing keydown
    // with repeat=true — so merely deleting WASD from heldKeys here isn't
    // enough, the very next repeat event would just re-add it and the
    // drive would silently resume. driveLocked instead blocks drive
    // output outright until every drive key has been actually released
    // (a real keyup, which repeat events don't produce).
    let driveLocked = false;
    const DRIVE_KEYS = ["KeyW", "KeyA", "KeyS", "KeyD"];

    function stopDrive() {
      driveLocked = true;
      setMotor("l", 0);
      setMotor("r", 0);
    }

    // ---- Keyboard control ---------------------------------------------
    // Arrow keys: pan/tilt (held = continuous). I/O: zoom (held =
    // continuous). F/L: momentary fire/load pulse, not latching — a
    // second press while the pulse is mid-flight does nothing (ignores
    // key-repeat) until it's released. W A S D: tank-steer drive, mixed
    // from whichever of the four are currently held, scaled by the Speed
    // slider. Escape: immediate stop (same as the All stop button) —
    // safe to preventDefault outside of fullscreen; browsers force
    // Escape to exit fullscreen regardless, if this page is ever shown
    // that way.

    let driveSpeed = 150;
    const heldKeys = new Set();
    const CONTINUOUS_KEYS = new Set([
      "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight",
      "KeyI", "KeyO", "KeyW", "KeyA", "KeyS", "KeyD",
    ]);

    window.addEventListener("keydown", (event) => {
      if (CONTINUOUS_KEYS.has(event.code)) {
        event.preventDefault();
        heldKeys.add(event.code);
      } else if (event.code === "KeyF" && !event.repeat) {
        event.preventDefault();
        triggerPulse("fire", document.getElementById("fireBtn"));
      } else if (event.code === "KeyL" && !event.repeat) {
        event.preventDefault();
        triggerPulse("load", document.getElementById("loadBtn"));
      } else if (event.code === "Escape" && !event.repeat) {
        event.preventDefault();
        stopDrive();
      }
    });

    window.addEventListener("keyup", (event) => {
      if (CONTINUOUS_KEYS.has(event.code)) {
        event.preventDefault();
        heldKeys.delete(event.code);
        if (driveLocked && !DRIVE_KEYS.some((k) => heldKeys.has(k))) {
          driveLocked = false;
        }
      }
    });

    // Loses key state if focus leaves the page (e.g. alt-tab) while a
    // key is physically still down — otherwise it'd keep "driving".
    window.addEventListener("blur", () => { heldKeys.clear(); driveLocked = false; });

    let driveWasActive = false;

    function keyboardTick() {
      if (heldKeys.has("ArrowLeft") || heldKeys.has("ArrowRight")) {
        const delta = (heldKeys.has("ArrowRight") ? 1 : 0) - (heldKeys.has("ArrowLeft") ? 1 : 0);
        setServo("pan", Number(servoSliderEl("pan").value) + delta * PAN_TILT_STEP_DEG);
      }
      if (heldKeys.has("ArrowUp") || heldKeys.has("ArrowDown")) {
        const delta = (heldKeys.has("ArrowUp") ? 1 : 0) - (heldKeys.has("ArrowDown") ? 1 : 0);
        setServo("tilt", Number(servoSliderEl("tilt").value) + delta * PAN_TILT_STEP_DEG);
      }
      if (heldKeys.has("KeyI") || heldKeys.has("KeyO")) {
        const delta = (heldKeys.has("KeyI") ? 1 : 0) - (heldKeys.has("KeyO") ? 1 : 0);
        setServo("zoom", Number(servoSliderEl("zoom").value) + delta * ZOOM_STEP_DEG);
      }

      const forward = driveLocked ? 0 : (heldKeys.has("KeyW") ? 1 : 0) - (heldKeys.has("KeyS") ? 1 : 0);
      const turn = driveLocked ? 0 : (heldKeys.has("KeyD") ? 1 : 0) - (heldKeys.has("KeyA") ? 1 : 0);
      const driveActive = forward !== 0 || turn !== 0;
      if (driveActive || driveWasActive) {
        const left = Math.max(-1, Math.min(1, forward + turn));
        const right = Math.max(-1, Math.min(1, forward - turn));
        setMotor("l", left * driveSpeed);
        setMotor("r", right * driveSpeed);
      }
      driveWasActive = driveActive;
    }

    startVideo();
    startControlSocket();
    wireControls();
    requestAnimationFrame(render);
    setInterval(keyboardTick, KEY_TICK_MS);

    // Keeps the ESP32's deadman timeout from tripping while a motor is
    // deliberately held at a non-zero speed and no slider is moving.
    setInterval(() => sendCommand({ type: "ping" }), HEARTBEAT_INTERVAL_MS);
  </script>
</body>
